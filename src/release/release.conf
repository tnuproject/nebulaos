# ==============================================================================
# NebulaOS — Centralized Release Configuration
# Single Source of Truth for System Identity, Versioning & Branding
# ==============================================================================

# Operating System Metadata
PRODUCT_NAME="NebulaOS"
PRODUCT_ID="nebulaos"
PRETTY_NAME="NebulaOS 26.0 \"Apollo\""
DISTRO_FAMILY="independent"

# Versioning
VERSION="26.0"
MAJOR_VERSION="26"
MINOR_VERSION="0"
PATCH_VERSION="0"
CODENAME="Apollo"
ARCHITECTURE="x86_64"

# ISO Deliverable Naming
ISO_NAME="${PRODUCT_NAME}-${VERSION}-${CODENAME}-${ARCHITECTURE}.iso"
ISO_LABEL="NEBULAOS_LIVE"
ISO_PUBLISHER="NebulaOS Project"
